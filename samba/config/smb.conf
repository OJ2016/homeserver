[global]
   workgroup = WORKGROUP
   server string = samba
   security = user
   map to guest = Never
   server role = standalone server
   idmap config * : range = 3000-7999

   # logs go to docker logs (smbd runs with --debug-stdout)
   log level = 1

   # no printing
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # SMB protocol - iOS requires SMB2 or higher
   server min protocol = SMB2
   server max protocol = SMB3
   # Samba >= 4.22 enables SMB3 POSIX extensions by default; Apple clients
   # that negotiate them show empty folders, so keep them off
   smb3 unix extensions = no

   # Apple/iOS compatibility (metadata in xattrs, as before)
   ea support = yes
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:nfs_aces = no

[share]
   path = /shared
   browseable = yes
   read only = no
   guest ok = no
   valid users = fileshare
   force user = fileshare
   force group = smb
   create mask = 0660
   directory mask = 0770
   veto files = /.apdisk/.DS_Store/.TemporaryItems/.Trashes/desktop.ini/ehthumbs.db/Network Trash Folder/Temporary Items/Thumbs.db/
   delete veto files = yes
