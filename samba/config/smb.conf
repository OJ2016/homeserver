[global]
   workgroup = WORKGROUP
   security = user
   map to guest = Never
   server role = standalone server
   log file = /var/log/samba/%m.log
   max log size = 50

[share]
   path = /share
   browseable = yes
   read only = no
   valid users = fileshare
   create mask = 0660
   directory mask = 0770
