services:
  samba:
    image: dperson/samba:latest
    container_name: samba
    restart: unless-stopped
    ports:
      - "445:445"
    volumes:
      - ./share:/share
    command: '-u "${SAMBA_USER};${SAMBA_PASS}" -s "share;/share;yes;no;no;${SAMBA_USER}" -w "WORKGROUP"'
    env_file:
      - .env
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - SYS_CHROOT
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    networks:
      - samba_net

networks:
  samba_net:
    driver: bridge
