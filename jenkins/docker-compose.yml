services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID}"
    security_opt:
      - no-new-privileges:true
    networks:
      - jenkins_net

networks:
  jenkins_net:
    driver: bridge
